name: StreamDash CI

on:
  push:
    branches:
      - main
      - feat/**
      - feature/**
  pull_request:
    branches:
      - main

env:
  NODE_VERSION: "22"

  BACKEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/streamdash-backend
  FRONTEND_IMAGE: ${{ secrets.DOCKER_USERNAME }}/streamdash-frontend

jobs:
  build:

    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:

      ####################################################
      # Checkout
      ####################################################

      - name: Checkout Repository
        uses: actions/checkout@v4

      ####################################################
      # Node
      ####################################################

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      ####################################################
      # Backend
      ####################################################

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm ci

      - name: Lint Backend
        working-directory: backend
        run: npm run lint --if-present

      - name: Build Backend
        working-directory: backend
        run: npm run build --if-present

      ####################################################
      # Frontend
      ####################################################

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint Frontend
        working-directory: frontend
        run: npm run lint --if-present

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      ####################################################
      # Security Audit
      ####################################################

      - name: Backend Dependency Audit
        working-directory: backend
        run: npm audit --audit-level=high || true

      - name: Frontend Dependency Audit
        working-directory: frontend
        run: npm audit --audit-level=high || true

      ####################################################
      # Docker Login
      ####################################################

      - name: Login to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      ####################################################
      # Build Docker Images
      ####################################################

      - name: Build Backend Docker Image
        run: |
          docker build \
            -t $BACKEND_IMAGE:${{ github.sha }} \
            -t $BACKEND_IMAGE:latest \
            -f backend/Dockerfile \
            backend

      - name: Build Frontend Docker Image
        run: |
          docker build \
            -t $FRONTEND_IMAGE:${{ github.sha }} \
            -t $FRONTEND_IMAGE:latest \
            -f frontend/Dockerfile \
            frontend

      ####################################################
      # Push Images
      ####################################################

      - name: Push Backend Docker Image
        if: github.event_name == 'push'
        run: |
          docker push $BACKEND_IMAGE:${{ github.sha }}
          docker push $BACKEND_IMAGE:latest

      - name: Push Frontend Docker Image
        if: github.event_name == 'push'
        run: |
          docker push $FRONTEND_IMAGE:${{ github.sha }}
          docker push $FRONTEND_IMAGE:latest
